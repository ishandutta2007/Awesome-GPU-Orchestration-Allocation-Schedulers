<svg fill="none" viewBox="0 0 1200 360" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0c192c" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="card-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="chip-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-blur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" />
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
        font-weight: 800;
        font-size: 40px;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
        font-weight: 500;
        font-size: 16px;
        fill: #94a3b8;
        letter-spacing: 0.2px;
      }
      .tag-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
        font-weight: 600;
        font-size: 12px;
        fill: #38bdf8;
      }
      .metric-label {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
        font-weight: 700;
        font-size: 11px;
        fill: #e2e8f0;
      }
      .metric-val {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
        font-weight: 700;
        font-size: 12px;
        fill: #10b981;
      }

      /* Dynamic Wave / Particle Animations */
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-8px) scale(1.02); }
      }
      @keyframes pulseBeam {
        0%, 100% { opacity: 0.3; stroke-dashoffset: 0; }
        50% { opacity: 0.9; stroke-dashoffset: -40; }
      }
      @keyframes flowData {
        0% { stroke-dashoffset: 100; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes rotateRings {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .floating-card-1 {
        animation: floatSlow 6s ease-in-out infinite;
      }
      .floating-card-2 {
        animation: floatSlow 7s ease-in-out 1s infinite;
      }
      .floating-card-3 {
        animation: floatSlow 5.5s ease-in-out 2s infinite;
      }
      .flow-line {
        stroke-dasharray: 8 12;
        animation: flowData 4s linear infinite;
      }
      .pulse-wire {
        animation: pulseBeam 4s ease-in-out infinite;
      }
      .spinning-node {
        transform-origin: 1020px 180px;
        animation: rotateRings 20s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="2" />

  <!-- Background Grid Mesh Pattern -->
  <g opacity="0.12">
    <path d="M 0,60 L 1200,60 M 0,120 L 1200,120 M 0,180 L 1200,180 M 0,240 L 1200,240 M 0,300 L 1200,300" stroke="#38bdf8" stroke-width="1" />
    <path d="M 150,0 L 150,360 M 300,0 L 300,360 M 450,0 L 450,360 M 600,0 L 600,360 M 750,0 L 750,360 M 900,0 L 900,360 M 1050,0 L 1050,360" stroke="#38bdf8" stroke-width="1" />
  </g>

  <!-- Dynamic Glowing Cluster Mesh in Background Right (stays behind text) -->
  <g opacity="0.35" class="pulse-wire">
    <path d="M 750,180 Q 860,70 1020,80 T 1150,180" fill="none" stroke="url(#primary-glow)" stroke-width="2" />
    <path d="M 720,240 Q 880,310 1020,260 T 1160,200" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <path d="M 850,120 L 1020,180 L 960,290" fill="none" stroke="#818cf8" stroke-width="1.5" class="flow-line" />
  </g>

  <!-- Dynamic Rotating Accelerator Orbit in Background -->
  <g class="spinning-node" opacity="0.25">
    <circle cx="1020" cy="180" r="110" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="6 8" />
    <circle cx="1020" cy="180" r="70" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 6" />
    <circle cx="1130" cy="180" r="5" fill="#38bdf8" />
    <circle cx="950" cy="180" r="4" fill="#c084fc" />
    <circle cx="1020" cy="110" r="4.5" fill="#10b981" />
    <circle cx="1020" cy="250" r="3.5" fill="#f59e0b" />
  </g>

  <!-- Background Decorative Ambient Glow Orb -->
  <circle cx="1020" cy="180" r="90" fill="#3b82f6" opacity="0.15" filter="url(#glow-filter)" />
  <circle cx="100" cy="40" r="70" fill="#6366f1" opacity="0.1" filter="url(#glow-filter)" />

  <!-- Animated Interactive Cluster / Pill Cards on Right Half (Background to Text) -->
  <!-- Card 1: Fractional GPU Slicing -->
  <g class="floating-card-1">
    <rect x="760" y="55" width="230" height="68" rx="10" fill="url(#card-glow)" stroke="#334155" stroke-width="1.5" />
    <rect x="774" y="69" width="30" height="30" rx="6" fill="#0369a1" />
    <text x="789" y="89" font-family="sans-serif" font-weight="900" font-size="16" fill="#38bdf8" text-anchor="middle">⚡</text>
    <text x="815" y="82" class="metric-label">Fractional GPU Slicing</text>
    <text x="815" y="99" class="metric-val">0.5 GPU • 86% Capacity</text>
  </g>

  <!-- Card 2: Gang Scheduling & DRA -->
  <g class="floating-card-2">
    <rect x="860" y="145" width="240" height="68" rx="10" fill="url(#card-glow)" stroke="#334155" stroke-width="1.5" />
    <rect x="874" y="159" width="30" height="30" rx="6" fill="#4338ca" />
    <text x="889" y="179" font-family="sans-serif" font-weight="900" font-size="16" fill="#a5b4fc" text-anchor="middle">⎈</text>
    <text x="915" y="172" class="metric-label">Gang & DRA Scheduling</text>
    <text x="915" y="189" class="metric-val">Zero Preemption Deadlock</text>
  </g>

  <!-- Card 3: Memory Reclamation & Sleep Mode -->
  <g class="floating-card-3">
    <rect x="770" y="235" width="220" height="68" rx="10" fill="url(#card-glow)" stroke="#334155" stroke-width="1.5" />
    <rect x="784" y="249" width="30" height="30" rx="6" fill="#065f46" />
    <text x="799" y="269" font-family="sans-serif" font-weight="900" font-size="16" fill="#34d399" text-anchor="middle">🔋</text>
    <text x="825" y="262" class="metric-label">Sleep Mode Reclamation</text>
    <text x="825" y="279" class="metric-val">95%+ VRAM Idle Release</text>
  </g>

  <!-- Foreground Title and Content Section (Left Anchored for Clean Hierarchy) -->
  <g transform="translate(60, 0)">
    <!-- Pill Badge -->
    <rect x="0" y="48" width="265" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="16" cy="62" r="4.5" fill="#38bdf8" />
    <text x="28" y="67" class="tag-text">AI INFRASTRUCTURE &amp; COMPUTE</text>

    <!-- Main Title -->
    <text x="0" y="128" class="title-text">
      Awesome GPU Orchestration
    </text>
    <text x="0" y="172" class="title-text" fill="url(#primary-glow)">
      &amp; Allocation Schedulers
    </text>

    <!-- Subtitle / Meta -->
    <text x="0" y="214" class="subtitle-text">
      Curated ecosystem of SaaS platforms &amp; open-source Kubernetes schedulers
    </text>
    <text x="0" y="238" class="subtitle-text">
      Optimized for fractional slicing, gang placement, and cluster utilization.
    </text>

    <!-- Tech Feature Pills -->
    <g transform="translate(0, 270)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="130" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="65" y="20" font-family="sans-serif" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">⚡ CUDA Slicing</text>

      <!-- Pill 2 -->
      <rect x="140" y="0" width="150" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="215" y="20" font-family="sans-serif" font-size="12" font-weight="600" fill="#a5b4fc" text-anchor="middle">⎈ Kubernetes DRA</text>

      <!-- Pill 3 -->
      <rect x="300" y="0" width="130" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="365" y="20" font-family="sans-serif" font-size="12" font-weight="600" fill="#34d399" text-anchor="middle">🚀 vLLM Serving</text>

      <!-- Pill 4 -->
      <rect x="440" y="0" width="140" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="510" y="20" font-family="sans-serif" font-size="12" font-weight="600" fill="#f472b6" text-anchor="middle">📈 Multi-Tenancy</text>
    </g>
  </g>
</svg>
